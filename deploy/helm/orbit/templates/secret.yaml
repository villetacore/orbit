{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbit.fullname" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseUrl: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  {{- $session := required "secrets.sessionSecret is required (or set secrets.existingSecret)" .Values.secrets.sessionSecret }}
  {{- if lt (len $session) 32 }}
  {{- fail "secrets.sessionSecret must be at least 32 characters" }}
  {{- end }}
  sessionSecret: {{ $session | quote }}
  oidcClientSecret: {{ required "secrets.oidcClientSecret is required (or set secrets.existingSecret)" .Values.secrets.oidcClientSecret | quote }}
  keycloakAdminClientSecret: {{ required "secrets.keycloakAdminClientSecret is required (or set secrets.existingSecret)" .Values.secrets.keycloakAdminClientSecret | quote }}
  {{- if eq .Values.storage.driver "s3" }}
  s3AccessKey: {{ required "secrets.s3AccessKey is required for storage.driver=s3" .Values.secrets.s3AccessKey | quote }}
  s3SecretKey: {{ required "secrets.s3SecretKey is required for storage.driver=s3" .Values.secrets.s3SecretKey | quote }}
  {{- end }}
{{- end }}
