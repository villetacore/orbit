# Local development stack.
#
#   docker compose up -d                 # Postgres + Keycloak (run API and web locally)
#   docker compose --profile app up -d   # + Orbit in a container on http://localhost:8080
#   docker compose --profile s3 up -d    # + MinIO for S3 avatar storage
#
# All secrets below are development-only values.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browsers and Orbit must see the same issuer URL.
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/orbit-realm.json:/opt/keycloak/data/import/orbit-realm.json:ro
      - keycloak:/opt/keycloak/data

  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: orbit
      MINIO_ROOT_PASSWORD: orbit-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  orbit:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      ORBIT_PUBLIC_URL: http://localhost:8080
      ORBIT_DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit?sslmode=disable
      ORBIT_SESSION_SECRET: dev-only-session-secret-change-me-0123456789
      ORBIT_SEED_DEMO: "true"
      ORBIT_KEYCLOAK_URL: http://localhost:8081
      ORBIT_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      ORBIT_OIDC_CLIENT_SECRET: orbit-web-dev-secret
      ORBIT_KEYCLOAK_ADMIN_CLIENT_SECRET: orbit-admin-api-dev-secret
      ORBIT_STORAGE_DIR: /home/nonroot/avatars
    ports:
      - "8080:8080"
    volumes:
      - avatars:/home/nonroot/avatars

volumes:
  postgres:
  keycloak:
  minio:
  avatars:
