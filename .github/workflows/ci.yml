name: CI

# On main this runs as the first step of release.yml.
on:
  pull_request:
  workflow_call:
    inputs:
      skip-image:
        description: Do not build the Docker image
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/next-version_test.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and validate chart
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          for v in deploy/helm/orbit/ci/*.yaml; do
            helm lint deploy/helm/orbit -f "$v"
            helm template orbit deploy/helm/orbit -f "$v" | "$(go env GOPATH)/bin/kubeconform" -strict -summary -
          done

  image:
    if: ${{ !inputs.skip-image }}
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orbit:ci .
