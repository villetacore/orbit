name: CI

# Checks run on every push to main, every vX.Y.Z tag and every pull request.
# The image and the chart are published only after all the checks have passed:
# main -> ghcr.io/villetacore/orbit:main and :sha-<short>
# vX.Y.Z tag -> image :X.Y.Z, :X.Y and the Helm chart as an OCI artifact
#
# The GitLab mirror treats the appearance of :sha-<short> in ghcr.io as a signal
# that the commit can be deployed, so nothing may publish it ahead of the checks.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and validate chart
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          for v in deploy/helm/orbit/ci/*.yaml; do
            helm lint deploy/helm/orbit -f "$v"
            helm template orbit deploy/helm/orbit -f "$v" | "$(go env GOPATH)/bin/kubeconform" -strict -summary -
          done

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orbit:ci .

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend, helm, image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/orbit --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "orbit-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
